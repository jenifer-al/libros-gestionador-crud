<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="imagenes/libros.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { screens: { '3xl': '1920px' } } } }
  </script>
  <title>LIBRERIA</title>
</head>

<body class="min-h-screen font-sans bg-gradient-to-r from-green-300 via-green-200 to-green-100">

  <header>
    <div class="font-bold text-center rounded-3xl border-8 border w-[300px] mt-2 border-double border-green-700 
     mx-auto text-gray-800 tracking-wide bg-gradient-to-r from-green-400 via-green-300 to-green-200
     uppercase sm:border-8 sm:w-[590px] md:border-8 md:w-[690px] lg:w-[990px] xl:w-[1200px] 2xl:w-[1200px] 3xl:w-[1600px] py-10 px-2 sm:px-4">

     <div class="flex items-center justify-center gap-1.5 sm:gap-6 lg:ml-1 xl:ml-2 2xl:ml-1">

      <img src="imagenes/libros.png" alt=" imagen de unos libros" 
           class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 lg:w-24 lg:h-24 xl:w-28 xl:h-28 object-contain transition-all duration-300 flex-shrink-0"/>

      <h1 class="font-bold text-green-50 drop-shadow-[0_4px_3px_rgba(20,83,45,0.75)] text-sm sm:text-3xl md:text-3xl lg:text-5xl xl:text-6xl 2xl:text-6xl tracking-wider">
        Mantenimiento de Libros
      </h1>

      </div>
    </div> 

    <div class="bg-[url(imagenes/libreari.jpg)] bg-[length:100%_100%] w-[250px] py-14 border-2 bg-no-repeat font-bold text-center
      rounded-3xl mt-2 border-double  border-8
      border-green-700 mx-auto text-gray-800 tracking-wide
     uppercase sm:py-28 sm:border-8 sm:w-[500px] md:border-8 md:w-[600px] lg:py-40 lg:w-[750px] xl:w-[850px] xl:h-[490px] 2xl:h-[490px] 2xl:w-[1089px]">
    </div> 

    <nav class="bg-gradient-to-r from-green-500 via-green-400 to-green-200 mt-10 px-6 py-4 
                flex flex-col sm:flex-row items-center justify-center
                w-[290px] sm:w-11/12 max-w-[1200px] 3xl:max-w-none 3xl:w-[1600px] mx-auto
                rounded-2xl z-10 shadow-sm sticky top-2 gap-4">
      <div class="flex flex-wrap gap-2 justify-center">
        <button id="btn-agregar" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 
        rounded-lg text-sm transition-colors shadow-sm focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">1. AGREGAR</button>
        <button id="btn-modificar" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-4 py-2
         rounded-lg text-sm transition-colors shadow-sm focus:ring-2 focus:ring-amber-500 focus:ring-offset-2">2. MODIFICAR</button>
        <button id="btn-eliminar" class="bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2
         rounded-lg text-sm transition-colors shadow-sm focus:ring-2 focus:ring-red-500 focus:ring-offset-2">3. ELIMINAR</button>
        <button id="btn-mostrar" class="bg-slate-600 hover:bg-slate-700 text-white font-medium px-4 py-2
         rounded-lg text-sm transition-colors shadow-sm focus:ring-2 focus:ring-slate-500 focus:ring-offset-2">4. MOSTRAR</button>
      </div>
    </nav>
  </header>
  
  <main class="max-w-2xl mx-auto p-6 mt-4">
    <div class="rounded-2xl bg-gradient-to-br from-green-500 via-emerald-400 to-teal-300 border-green-800 border-2 shadow-xl p-6 sm:p-8 transition-all duration-300">
      
      <div class="mb-6 p-3 bg-white border-2 border-green-950 text-green-950 font-extrabold rounded-xl text-sm text-center shadow-md" id="estado-operacion">
        Selecciona una operación en el menú superior para comenzar
      </div>
      
      <form id="form-libro" class="space-y-5">
        <div>
          <label for="isbn" class="block text-sm font-extrabold text-green-950 uppercase tracking-wide mb-1">ISBN (Código Clave)</label>
          <input type="text" id="isbn" disabled class="w-full font-mono border-4 border-green-950 rounded-xl px-3 py-2 
          text-sm focus:ring-4 focus:ring-green-600 bg-amber-50/70 text-green-950 font-bold disabled:opacity-80 transition-all">
        </div>
        
        <fieldset id="campos-libro" disabled class="space-y-5 group disabled:opacity-75">
          <div>
            <label class="block text-sm font-extrabold text-green-950 uppercase tracking-wide mb-1">Título del Libro</label>
            <input type="text" id="titulo" class="w-full border-4 border-green-950 rounded-xl px-3 py-2 text-sm bg-white text-gray-900 font-medium focus:ring-4 focus:ring-green-600 transition-all">
          </div>
          <div>
            <label class="block text-sm font-extrabold text-green-950 uppercase tracking-wide mb-1">Autor</label>
            <input type="text" id="autor" class="w-full border-4 border-green-950 rounded-xl px-3 py-2 text-sm bg-white text-gray-900 font-medium focus:ring-4 focus:ring-green-600 transition-all">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-extrabold text-green-950 uppercase tracking-wide mb-1">Stock</label>
              <input type="number" id="stock" class="w-full border-4 border-green-950 rounded-xl px-3 py-2 text-sm bg-white text-gray-900 font-medium focus:ring-4 focus:ring-green-600 transition-all">
            </div>
            <div>
              <label class="block text-sm font-extrabold text-green-950 uppercase tracking-wide mb-1">Precio (€)</label>
              <input type="number" step="0.01" id="precio" class="w-full border-4 border-green-950 rounded-xl px-3 py-2 text-sm bg-white text-gray-900 font-medium focus:ring-4 focus:ring-green-600 transition-all">
            </div>
          </div>
        </fieldset>

        <div id="acciones-formulario" class="hidden flex justify-end gap-3 pt-4 border-t-2 border-green-950">
            <button type="button" id="btn-cancelar" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-md">Cancelar</button>
            <button type="submit" id="btn-confirmar" class="bg-green-950 hover:bg-black text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-md">Confirmar</button>
        </div>
      </form>
    </div>

    <dialog id="dialog-informativo" class="rounded-2xl bg-gradient-to-br from-green-500 via-emerald-400 to-teal-300 border-green-800 border-2 shadow-2xl p-6 w-[90%] max-w-md transition-all duration-300 backdrop:bg-black/40">
      <h3 id="info-titulo" class="font-extrabold text-xl text-green-950 uppercase tracking-wide border-b-2 border-green-950/30 pb-2">Aviso</h3>
      <p id="info-mensaje" class="text-sm font-bold text-green-950 my-5 bg-white/80 border-2 border-green-950 p-3 rounded-xl shadow-inner">Mensaje.</p>
      
      <div class="flex justify-end gap-3">
        <button id="dialog-btn-cancelar" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-md">Cancelar</button>
        <button id="info-btn-aceptar" class="bg-green-950 hover:bg-black text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-md">Ok</button>
      </div>
    </dialog>
  </main>

  <script src="./js/clase-libro.js"></script>
  <script src="./js/libros.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
